# $schema=https://www.schemastore.org/github-workflow.json
#
# Publishes the Python packages of this repository to PyPI for every release
# tag: the CLI in `cli/` as `codehood-cli`, then the grading worker in
# `workers/chalk-worker/` as `chalk-worker`. Both share the server's version:
# `pnpm run release` bumps them and tags `vX.Y.Z` once. The worker pins
# `codehood-cli==X.Y.Z`, so it goes up only after the CLI is on PyPI.
#
# PyPI uses trusted publishing: each project lists this repository and this
# workflow file as a trusted publisher, `codehood-cli` with the "pypi"
# environment and `chalk-worker` with "pypi-worker".
on:
  push:
    tags:
      - "v*.*.*"

name: publish-python

jobs:
  cli:
    name: upload codehood-cli to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Check that the tag is the CLI's version
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "cli/pyproject.toml is at $version, the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      # mdq comes from a sibling checkout in development ([tool.uv.sources]);
      # the published package must depend on the PyPI release instead.
      - name: Build package distributions
        run: uv build --no-sources

      - name: Publish to PyPI
        run: uv publish

  worker:
    name: upload chalk-worker to PyPI
    needs: cli
    runs-on: ubuntu-latest
    # A trusted publisher is one (repository, workflow, environment) per
    # project, so the worker publishes from an environment of its own.
    environment: pypi-worker
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: workers/chalk-worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Check that the tag is the worker's version
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "workers/chalk-worker/pyproject.toml is at $version, the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      # codehood-cli comes from ../../cli in development ([tool.uv.sources]);
      # the published package pins the PyPI release instead.
      - name: Build package distributions
        run: uv build --no-sources

      - name: Publish to PyPI
        run: uv publish
