name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `ENVIRONMENT` has no default and a fresh checkout has no `.env`, so the
# seed, the generators and the build would all refuse to run without it.
env:
  ENVIRONMENT: dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm run lint` typechecks, and `src/generated/` and the Prisma client
      # are both gitignored, so a fresh checkout has neither.
      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Generate sources
        run: pnpm run generate

      # Also we need to create the astro files like astro:actions and so
      # on for the first run.
      - name: Generate Astro files
        run: pnpm run astro sync

      - name: Run default linter
        run: pnpm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Reset database
        run: pnpm run db:reset

      - name: Run tests with coverage
        run: pnpm run coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  cli:
    runs-on: ubuntu-latest
    steps:
      # `cli/pyproject.toml` takes `mdq` from `../../mdq/mdq-py`, so the two
      # repositories are checked out side by side.
      - uses: actions/checkout@v4
        with:
          path: codehood

      - uses: actions/checkout@v4
        with:
          repository: fabiommendes/mdq-spec
          path: mdq

      - uses: astral-sh/setup-uv@v6

      - name: Run CLI tests
        working-directory: codehood/cli
        run: uv run pytest
